name: Deploy Portfolio

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push image
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker build -t joannegton/portfolio:latest .
          docker push joannegton/portfolio:latest

      - name: Deploy
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/portfolio-app -n portfolio-prod --timeout=120s

      - name: Verify
        run: kubectl get pods -n portfolio-prod
