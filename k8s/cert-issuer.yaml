# ============================================================================
# CLUSTERISSUER - Gera certificados SSL/TLS automaticamente
# ============================================================================
# ClusterIssuer = Autoridade de Certificação que emite certificados SSL
# Integrado com Let's Encrypt (gratuito e automático)
# Renovação automática 30 dias antes de expirar

apiVersion: cert-manager.io/v1
kind: ClusterIssuer

metadata:
  name: letsencrypt-prod                  # Nome referenciado no Ingress/IngressRoute
  labels:
    app: portfolio

spec:
  # ========== ACME (Automatic Certificate Management Environment) ==========
  acme:
    # ========== SERVIDOR DO CERTIFICADO ==========
    server: https://acme-v02.api.letsencrypt.org/directory  # Let's Encrypt (produção)

    # ========== EMAIL PARA NOTIFICAÇÕES ==========
    email: joannegton@gmail.com              # Email para avisos de expiração

    # ========== CHAVE PRIVADA ==========
    privateKeySecretRef:
      name: letsencrypt-prod              # Secret onde armazena a chave privada

    # ========== MÉTODOS DE VALIDAÇÃO DE DOMÍNIO ==========
    solvers:
    # HTTP-01: Validação via HTTP (requer acesso ao domínio)
    - http01:
        ingress:
          class: traefik                  # Integrado com Traefik (K3s nativo)
