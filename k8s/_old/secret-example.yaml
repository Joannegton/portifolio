# ============================================================================
# SECRET - Dados Sensíveis (Senha do Banco de Dados)
# ============================================================================
# ⚠️ IMPORTANTE: NÃO commite este arquivo em Git!
#
# Opções de como criar:
# 1. Usar Sealed Secrets (recomendado)
# 2. Usar Rancher Secrets (integrado no RKE2)
# 3. Usar kubectl create secret
# 4. Usar Vault ou outro secret manager

---
# OPÇÃO 1: Secret simples (para desenvolvimento)
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio-prod
type: Opaque
stringData:
  # Senha do PostgreSQL
  # ⚠️ SUBSTITUIR COM A SENHA REAL ANTES DE FAZER DEPLOY
  DB_PASSWORD: "CHANGE_ME_BEFORE_DEPLOYING"

  # Outras APIs/Keys se necessário
  # API_KEY: "sua-chave-api"
  # JWT_SECRET: "seu-jwt-secret"

---
# OPÇÃO 2: Secret para Docker Hub (se imagem for privada)
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: portfolio-prod
type: docker.io/secret
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "docker.io": {
          "username": "joannegton",
          "password": "seu-docker-token",
          "auth": "base64-encoded-credentials"
        }
      }
    }

---
# OPÇÃO 3: Sealed Secret (recomendado para produção)
# Primeiro instale: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
# Depois crie com: kubectl create secret generic portfolio-secrets --from-literal=DB_PASSWORD='...' -n portfolio-prod --dry-run=client -o yaml | kubeseal > sealedsecret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: portfolio-secrets
  namespace: portfolio-prod
spec:
  encryptedData:
    DB_PASSWORD: AgBvB3x... # Esta parte é criptografada
  template:
    metadata:
      name: portfolio-secrets
      namespace: portfolio-prod
    type: Opaque
