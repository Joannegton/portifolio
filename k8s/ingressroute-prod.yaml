# Cloudflare Tunnel termina TLS — Traefik recebe apenas HTTP interno
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-ingress
  namespace: portfolio-prod
  labels:
    app: portfolio
    environment: production
  annotations:
    description: "IngressRoute para Portfolio App via Cloudflare Tunnel"

spec:
  entryPoints:
  - web

  routes:
  - match: Host(`joannegton.com`) || Host(`www.joannegton.com`)
    kind: Rule
    services:
    - name: portfolio-app
      port: 80
    middlewares:
    - name: redirect-www
    - name: security-headers

---
# Redirecionar www para non-www
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
  namespace: portfolio-prod
spec:
  redirectRegex:
    regex: "^https?://www\\.joannegton\\.com/(.*)"
    replacement: "https://joannegton.com/$1"
    permanent: true

---
# Security Headers
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: portfolio-prod
spec:
  headers:
    customResponseHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"
      Strict-Transport-Security: "max-age=63072000; includeSubDomains"
    customRequestHeaders:
      X-Forwarded-Proto: "https"
