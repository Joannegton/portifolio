# ============================================================================
# CONFIGMAP - Armazena configurações e variáveis de ambiente
# ============================================================================
# ConfigMap centraliza dados de configuração NÃO sensíveis
# Mudanças aqui afetam TODOS os pods ao fazer redeploy
# Para dados sensíveis (senhas), use Secrets ao invés de ConfigMap

apiVersion: v1
kind: ConfigMap

metadata:
  name: portfolio-config             # Nome referenciado no deployment.yaml
  namespace: portfolio-prod          # Mesmo namespace dos pods
  labels:
    app: portfolio                   # Identificação

# ========== DADOS DE CONFIGURAÇÃO ==========
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  DB_SSL: "false"
