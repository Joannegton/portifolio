# ============================================================================
# EXEMPLO de Secret - NÃO COMITAR com valores reais
# Aplicar manualmente na VPS: kubectl apply -f secret-portfolio.yaml -n portfolio-prod
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio-prod
type: Opaque
stringData:
  # Banco de dados
  POSTGRES_USER: "portfolio_user"
  POSTGRES_PASSWORD: "SUBSTITUA_POR_SENHA_FORTE"
  DATABASE_URL: "postgresql://portfolio_user:SUBSTITUA_POR_SENHA_FORTE@portfolio-postgres:5432/portfolio"
  # Auth service
  AUTH_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    SUBSTITUA_PELA_CHAVE_PUBLICA_DO_AUTH_SERVICE
    -----END PUBLIC KEY-----
  NEXT_PUBLIC_AUTH_SERVICE_URL: "https://auth-demo.joannegton.com"
  NEXT_PUBLIC_APP_URL: "https://joannegton.com"
  # Notificações (Fase 2)
  TELEGRAM_BOT_TOKEN: "SUBSTITUA_PELO_TOKEN_DO_BOT"
  TELEGRAM_CHAT_ID: "SUBSTITUA_PELO_SEU_CHAT_ID"
  RESEND_API_KEY: "SUBSTITUA_PELA_CHAVE_RESEND"
